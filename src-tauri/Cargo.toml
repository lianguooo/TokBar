[package]
name = "tokbar"
version = "0.5.0"
description = "TokBar - AI Usage Dashboard"
authors = ["TokBar"]
edition = "2021"

[lib]
name = "tokbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
# Blocking WebSocket for the Chrome DevTools Protocol connection to Codex.
# No TLS features: the debug endpoint is plain ws:// on loopback only.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
