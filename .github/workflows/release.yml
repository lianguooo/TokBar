name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # macOS 代码签名与公证只在上游仓库启用(那里配置了有效的 Apple 证书
      # Secret)。这里只在上游把 APPLE_* 写入环境;fork 上这些变量根本不存在
      # (而非空字符串)—— tauri 见到已定义的 APPLE_CERTIFICATE 就会尝试导入证书,
      # 空值会以 "SecKeychainItemImport: parameters not valid" 失败,故必须整个不设。
      - name: Enable macOS signing (upstream only)
        if: matrix.platform == 'macos-latest' && github.repository == 'peng2132/TokBar'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: when these secrets are set, tauri-action signs the
          # bundles and publishes latest.json to the release for auto-updates.
          # On forks without the secrets, it builds normally (no updater feed).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TokBar __VERSION__'
          releaseBody: |
            下载说明:
            - macOS (Apple Silicon): `*_aarch64.dmg`
            - macOS (Intel): `*_x64.dmg`
            - Windows: `*_x64-setup.exe` 或 `*.msi`

            macOS: 已签名版本可直接打开;未签名版本首次打开请右键点按 App 选「打开」,
            或在「系统设置 → 隐私与安全性」中点「仍要打开」。
            Windows 出现 SmartScreen 提示时点击"更多信息 → 仍要运行"。
          releaseDraft: true
          prerelease: false
          # Updater artifacts (signed bundles + latest.json) are produced only
          # on the upstream repo, which holds TAURI_SIGNING_PRIVATE_KEY. Forks
          # lack the key, so enabling it there would fail the build — they build
          # normally without an updater feed.
          args: ${{ matrix.args }}${{ github.repository == 'lianguooo/TokBar' && ' --config {"bundle":{"createUpdaterArtifacts":true}}' || '' }}
